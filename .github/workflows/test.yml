name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flybot-sg/ci-clj-clr:2.1.0
    steps:
      - uses: actions/checkout@v6

      # Job-level env: cannot expand $HOME; nostrand and tools.deps read GITLIBS
      # literally, so it must be an absolute path. This makes nostrand clone its
      # git deps under ~/.gitlibs/nostrand/, which the cache step below persists.
      - name: Point nostrand git deps at the cached gitlibs dir
        run: echo "GITLIBS=$HOME/.gitlibs" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Format check
        run: bb fmt-check

      - name: Run JVM tests
        run: bb jvm-test

      - name: Run CLR tests
        run: bb clr-test
